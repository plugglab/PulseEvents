prefix: "&6[PulseEvents] "

command:
  usage: "&eUse: &f/pe help"
  unknown: "&cUnknown subcommand."
  no-permission: "&cYou do not have permission to use this command."
  system-disabled: "&cThe event system is currently disabled."
  help:
    header: "&eAvailable PulseEvents commands:"
    line-help: "&6/pe help &7- Show all plugin commands"
    line-start: "&6/pe start &7- Start a random event immediately"
    line-stop: "&6/pe stop &7- Stop the current event"
    line-status: "&6/pe status &7- Show the current event status"
    line-events: "&6/pe events &7- Open the event chances menu"
    line-vote: "&6/pe vote [event] &7- Vote for an event or open the voting GUI"
    line-votes: "&6/pe votes <list|reset> &7- Inspect or reset round votes"
    line-streak: "&6/pe streak <check|reset> &7- Inspect or reset player streaks"
    line-stats: "&6/pe stats &7- Show event and vote statistics"
    line-leaderboard: "&6/pe leaderboard [streak|points] &7- Show the streak or points leaderboard"
    line-profile: "&6/pe profile [player] &7- Show Pulse Points, level and streak"
    line-actionbar: "&6/pe actionbar &7- Toggle the personal event action bar"
    line-validate: "&6/pe validate &7- Validate custom event files"
    line-queue: "&6/pe queue <add|list|remove|clear> &7- Manage the FIFO event queue"
    line-toggle: "&6/pe toggle <on|off> &7- Enable or disable the event system"
    line-reload: "&6/pe reload &7- Reload config and language files"
    line-update: "&6/pe update &7- Check for a new plugin version"
  cooldown:
    command: "&cYou must wait &f%time%&c second(s) before using another admin command."
    event-start-global: "&cGlobal event start cooldown is active for another &f%time%&c second(s)."
    event-start-player: "&cYou must wait &f%time%&c second(s) before starting another event."
  start:
    success: "&aA random event has been started."
    failed: "&cThe event could not be started. Make sure players are online."
    no-events: "&cNo events are registered."
    already-running: "&cAn event is already running: &f%event%&c."
  stop:
    success: "&cStopped event: &f%event%"
    no-event: "&cThere is no active event to stop."
  status:
    running: "&aCurrent event: &f%event%"
    idle: "&eNo event is active right now."
  events:
    header: "&eRegistered events:"
    admin-only: "&7Admins can edit chances in the GUI. Players should use &f/pe vote&7."
    line: "&6%index%. &f%event%"
  vote:
    players-only: "&cOnly players can vote."
    no-voting-gui: "&cThe voting GUI is not available right now."
    invalid-event: "&cUnknown votable event: &f%event%"
  votes:
    usage: "&eUse: &f/pe votes <list|reset>"
    header: "&eCurrent votes:"
    empty: "&7No active votes."
    line: "&6%event%&7: &f%votes%"
    reset: "&aAll votes have been cleared."
  streak:
    usage: "&eUse: &f/pe streak <check|reset> [player|all]"
    check: "&e%player%&7 streak: &f%streak%&7. Next milestone: &f%next%"
    reset-all: "&aAll streaks have been cleared."
    reset-player: "&aCleared streak for &f%player%&a."
    player-not-found: "&cPlayer not found: &f%player%"
  stats:
    header: "&eEvent statistics:"
    running: "&7Current event: &f%event%"
    queue: "&7Queued events: &f%amount%"
    top-streak: "&7Top streak: &f%amount%"
    top-voted: "&7Top voted event: &f%event%"
    top-started: "&7Most started event: &f%event%"
  leaderboard:
    header: "&eStreak leaderboard:"
    points-header: "&ePulse Points leaderboard:"
    empty: "&7No streaks recorded yet."
    line: "&6%index%. &f%player% &7- &f%streak%"
    points-line: "&6%index%. &f%player% &7- &f%points% &7(Lvl. &f%level%&7)"
  profile:
    usage: "&eUse: &f/pe profile [player]"
    header: "&e%player%'s Pulse profile:"
    points: "&7Points: &f%points%"
    level: "&7Level: &f%level%"
    next-level: "&7Next level at: &f%points% &7points"
    streak: "&7Current streak: &f%streak%"
  validate:
    header: "&eCustom event validation:"
    clean: "&aNo validation problems found."
    line: "&c%message%"
  reload:
    success: "&aConfiguration and language files reloaded. Active language: &f%language%&a."
  toggle:
    usage: "&eUse: &f/pe toggle <on|off>"
    enabled: "&aThe event system has been enabled."
    disabled: "&cThe event system has been disabled."
  actionbar:
    enabled: "&aYou will now see the event action bar."
    disabled: "&cYou will no longer see the event action bar."
  update:
    checking: "&7Checking GitHub for the latest release..."
  queue:
    usage: "&eUse: &f/pe queue <add|list|remove|clear>"
    add-usage: "&eUse: &f/pe queue add <event>"
    remove-usage: "&eUse: &f/pe queue remove <index>"
    invalid-event: "&cUnknown event: &f%event%"
    invalid-index: "&cInvalid queue index."
    add-success: "&aAdded event to queue: &f%event%"
    remove-success: "&aRemoved event from queue: &f%event%"
    clear-success: "&aThe event queue has been cleared."
    empty: "&eThe event queue is currently empty."
    header: "&eQueued events:"
    line: "&6%index%. &f%event%"

announcement:
