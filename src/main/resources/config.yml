settings:
  language: en

cooldown:
  event-start: 300
  command: 5

events:
  enabled: true
  min-interval: 180
  max-interval: 600
  coin-rain:
    chance: 100
    reward:
      min: 1.0
      max: 5.0
    drop-interval-ticks: 10
    velocity-multiplier: 0.4
  lightning-storm:
    chance: 100
  tnt-rain:
    chance: 100
  mob-swarm:
    chance: 100
  random-teleport:
    chance: 100
  fire-feet:
    chance: 100
  freeze:
    chance: 100
  black-hole:
    chance: 100
  random-effects:
    chance: 100
  target-player:
    chance: 100
  spin:
    chance: 100

streak-rewards:
  milestones:
    #modes vault/command/item
    #vaules for command and item must be in "" (exp value: "DIAMOND 3")
    "3":
      mode: vault
      value: 5.0
    "5":
      mode: vault
      value: 15.0
    "10":
      mode: vault
      value: 50.0

voting:
  cost: 100.0

announcements:
  times:
    - 10
    - 5
    - 1

queue:
  retry-delay-seconds: 15

bossbar:
  enabled: true
  color: BLUE
  style: SOLID

actionbar:
  enabled: true
  format: "&b%event% &7| &f%time%s"

progression:
  enabled: true
  autosave-interval-minutes: 5
  points:
    participation: 5
    survival: 10
    vote: 2
    streak-milestone-bonus: 15
    combo-bonus: 10
  multiplier:
    #set enabled to true to run a points multiplier on the listed days (e.g. weekend bonus)
    enabled: false
    value: 2.0
    days:
      - SATURDAY
      - SUNDAY
  levels:
    #define one entry per level; "points" is the total points required to reach it
    #reward modes: vault/command/item (same format as streak-rewards)
    "1":
      points: 0
    "2":
      points: 50
    "3":
      points: 150
      reward:
        mode: vault
        value: 10.0
    "4":
      points: 300
    "5":
      points: 500
      reward:
        mode: item
        value: "DIAMOND 3"
    "7":
      points: 900
    "10":
      points: 1500
      reward:
        mode: command
        value: "give %player% netherite_ingot 1"

combos:
  enabled: false
  chance: 20
  exclude:
    - coin-rain
    - target-player

#override how long an event must wait before it can be picked again, in seconds.
#"default" applies to every event without its own entry below. Keys match the event's
#key (see /pe events), e.g. the class-based key for LightningStormEvent is "lightning-storm".
event-cooldowns:
  default: 0
  #lightning-storm: 120
  #tnt-rain: 180

#makes the random picker favor events that haven't run in a while, and avoid
#repeating the same event back-to-back, on top of the normal chance weighting.
weighting:
  recency-bias:
    enabled: true
    decay-minutes: 15
    min-multiplier: 0.2

update-check:
  enabled: true
  check-on-startup: true
  notify-on-join: true

multiworld:
  enabled: true
  allowed-worlds:
    - world
    - event_world
